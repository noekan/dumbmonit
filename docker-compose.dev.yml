# Development overlay: adds a lab SNMP agent and exposes the embedded
# VictoriaMetrics, so collection can be tested without hardware.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# Then add a device of type SNMP with address `snmp-lab` and community `public`:
# the profile is detected on its own and the graphs fill up.

services:
  snmp-lab:
    image: polinux/snmpd
    hostname: snmp-lab
    volumes:
      - ./docker/snmpd-lab.conf:/etc/snmp/snmpd.conf:ro
    restart: unless-stopped

  dumbmonit:
    environment:
      # The embedded VictoriaMetrics listens on the loopback by default; open it
      # inside the container so the port below reaches it.
      DUMBMONIT_VM_LISTEN: 0.0.0.0:8428
    ports:
      # Handy for querying MetricsQL directly while debugging.
      - "${DUMBMONIT_VM_PORT:-8428}:8428"
