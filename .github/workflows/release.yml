name: Release

# Builds the multi-arch images with the repository Dockerfile and pushes them to
# ghcr.io/noekan/dumbmonit (server) and ghcr.io/noekan/dumbmonit-agent (agent,
# `--target agent-image`), with the same tags:
#   - every push to main   -> :edge
#   - every tag v*         -> :X.Y.Z, :X.Y, :X and :latest
# CI (ci.yml) builds the same images without pushing, on every push and PR.

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/noekan/dumbmonit
  AGENT_IMAGE: ghcr.io/noekan/dumbmonit-agent

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          # `latest` follows tagged releases only, never main.
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=DumbMonit
            org.opencontainers.image.description=Dumb-simple monitoring for homelabs and small teams
            org.opencontainers.image.licenses=Apache-2.0

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: agent-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.AGENT_IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=DumbMonit agent
            org.opencontainers.image.description=DumbMonit agent, for Docker hosts and remote sites (relay mode)
            org.opencontainers.image.licenses=Apache-2.0

      # Same Dockerfile, second target: the layers above are reused from cache.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: agent-image
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.agent-meta.outputs.tags }}
          labels: ${{ steps.agent-meta.outputs.labels }}
          annotations: ${{ steps.agent-meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Agent macOS.
  #
  # Il ne peut pas sortir de l'image : compiler pour macOS exige le SDK d'Apple,
  # que sa licence interdit de redistribuer, et aucun conteneur ne peut donc le
  # construire légalement. Il est donc construit ici, sur un vrai exécuteur
  # macOS, et attaché à la publication — c'est ce que le serveur indique quand
  # on lui demande `/download/dumbmonit-agent-macos-…`.
  #
  # Les deux architectures sont livrées séparément plutôt qu'en binaire
  # universel : l'agent se télécharge par un script qui connaît déjà la sienne.
  # ---------------------------------------------------------------------------
  macos-agent:
    name: Build the macOS agent
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # Même version que l'étape `agent` du Dockerfile : l'agent livré ne doit
      # pas dépendre de la date de construction, ni de la plateforme.
      - run: |
          rustup toolchain install 1.98.0 --profile minimal \
            --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default 1.98.0

      # Mêmes réglages que le Dockerfile : l'agent se télécharge sur une liaison
      # parfois lente, la taille prime sur la vitesse de compilation.
      - name: Build
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: s
          CARGO_PROFILE_RELEASE_LTO: fat
        run: |
          set -eu
          mkdir -p dist
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p dumbmonit-agent --target "$target"
          done
          cp target/aarch64-apple-darwin/release/dumbmonit-agent dist/dumbmonit-agent-macos-aarch64
          cp target/x86_64-apple-darwin/release/dumbmonit-agent  dist/dumbmonit-agent-macos-x86_64
          # Même format que les empreintes servies par le serveur : `sha256sum -c`
          # et `shasum -a 256 -c` les lisent toutes les deux.
          cd dist
          for binary in dumbmonit-agent-macos-*; do
            shasum -a 256 "$binary" > "$binary.sha256"
          done
          ls -l

      # Sur une version publiée : les binaires rejoignent la page de la version,
      # d'où install.sh --bin=… les attend.
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*

      # Sur main : gardés comme artefact de la construction, pour que l'agent
      # macOS de la version de développement reste récupérable.
      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/v')"
        with:
          name: dumbmonit-agent-macos
          path: dist/*
          retention-days: 30
