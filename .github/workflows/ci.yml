name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# A newer push to the same branch makes the running check pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The server embeds web/build at compile time (rust_embed): without it
      # the crate does not compile at all. Build the real interface rather than
      # a placeholder, so the tests that serve pages see what users get.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  licences:
    name: Licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      # Enforces the "100 % open source" promise: a dependency under a licence
      # that is not in deny.toml fails the build instead of being discovered
      # after publication.
      - run: cargo deny check licenses bans
      # RustSec advisories: a vulnerable dependency fails the build until it is
      # updated or explicitly ignored in deny.toml with a reason.
      - run: cargo deny check advisories

  web:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  image:
    timeout-minutes: 60
    name: Docker image (build only)
    runs-on: ubuntu-latest
    needs: [rust, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      # Same Dockerfile as release.yml, never pushed: this only proves the
      # build still works. amd64 only: arm64 runs under QEMU and takes hours;
      # release.yml builds both architectures when publishing.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The agent image (ghcr.io/noekan/dumbmonit-agent) is a second target of
      # the same Dockerfile; it reuses the layers just built.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: agent-image
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
