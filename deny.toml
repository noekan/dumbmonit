# Contrôle des licences des dépendances.
#
# DumbMonit se veut « 100 % open source » au sens des licences approuvées par l'OSI.
# Ce fichier transforme cette promesse en test automatisé : une dépendance sous
# licence copyleft forte ou sous licence « source-available » fait échouer la CI.

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "0BSD",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Les crates du workspace se référencent par chemin, sans version : c'est voulu.
allow-wildcard-paths = true

# Avis de sécurité (base RustSec). La CI les vérifie : une dépendance vulnérable
# fait échouer le build tant qu'elle n'est pas mise à jour ou, faute de
# correctif, explicitement ignorée ici avec sa raison.
[advisories]
version = 2
ignore = [
    # Marvin (attaque temporelle sur RSA) : `rsa` est tiré par `jsonwebtoken` et ne
    # sert qu'à vérifier des signatures RS256 avec la clé publique du fournisseur
    # OIDC — aucune clé privée RSA n'est manipulée. Pas de version corrigée en amont.
    { id = "RUSTSEC-2023-0071", reason = "vérification de signature seulement, pas de correctif amont" },
]
