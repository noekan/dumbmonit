# Dex for the DumbMonit lab: one static OIDC client, users and groups served by
# the glauth LDAP container (see ../glauth/glauth.cfg).
#
# The issuer must be reachable under the SAME URL by the DumbMonit container
# (discovery + token exchange) and by your browser (login page). It comes from
# the LAB_DEX_ISSUER variable in docker-compose.lab.yml — `http://dex:5556/dex`
# by default, which needs `127.0.0.1 dex` in the host's /etc/hosts; see
# docker/lab/README.md for the alternatives. The image's entrypoint renders this
# file with gomplate before starting, hence the getenv template below.
issuer: {{ getenv "LAB_DEX_ISSUER" "http://dex:5556/dex" }}

storage:
  type: memory

web:
  http: 0.0.0.0:5556

logger:
  level: info
  format: text

oauth2:
  skipApprovalScreen: true
  alwaysShowLoginScreen: false
  responseTypes: ["code"]

expiry:
  idTokens: 1h

staticClients:
  - id: dumbmonit
    secret: dumbmonit-lab-secret
    name: DumbMonit (lab)
    redirectURIs:
      - http://localhost:8080/api/auth/oidc/callback
      - http://127.0.0.1:8080/api/auth/oidc/callback
      - http://192.168.10.254:8080/api/auth/oidc/callback

connectors:
  - type: ldap
    id: lab-ldap
    name: Lab directory
    config:
      host: glauth:3893
      insecureNoSSL: true
      bindDN: cn=serviceuser,ou=svcaccts,ou=users,dc=lab,dc=local
      bindPW: lab-bind-password
      usernamePrompt: Email
      userSearch:
        baseDN: dc=lab,dc=local
        filter: "(objectClass=posixAccount)"
        username: mail
        idAttr: uidNumber
        emailAttr: mail
        nameAttr: cn
        preferredUsernameAttr: cn
      # glauth exposes groups as `ou=<name>,ou=users,dc=lab,dc=local` with the
      # members' DNs in `uniqueMember` (and their names in `memberUid`).
      groupSearch:
        baseDN: dc=lab,dc=local
        filter: "(objectClass=posixGroup)"
        userMatchers:
          - userAttr: DN
            groupAttr: uniqueMember
        nameAttr: ou
