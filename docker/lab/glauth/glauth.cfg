# Lab directory behind Dex. glauth is a single-binary LDAP server configured
# from this file; Dex's static passwords cannot carry group memberships, and the
# `dumbmonit-admins` group is exactly what the OIDC role mapping needs to test.
#
# Every password is "password" (sha256 below). Users log into Dex with their
# e-mail address.
#
#   admin@lab.local   groups: dumbmonit-admins, people   -> DumbMonit admin
#   viewer@lab.local  groups: people                     -> DumbMonit viewer
#   serviceuser       Dex's bind account, search only
#
# glauth builds DNs as cn=<user>,ou=<primary group>,ou=users,dc=lab,dc=local
# and groups as ou=<group>,ou=users,dc=lab,dc=local (posixGroup with
# uniqueMember + memberUid); the Dex connector config relies on that shape.

debug = false

[ldap]
  enabled = true
  listen = "0.0.0.0:3893"

[ldaps]
  enabled = false

[backend]
  datastore = "config"
  baseDN = "dc=lab,dc=local"
  nameformat = "cn"
  groupformat = "ou"

[behaviors]
  IgnoreCapabilities = false
  LimitFailedBinds = true
  NumberOfFailedBinds = 3
  PeriodOfFailedBinds = 10
  BlockFailedBindsFor = 60
  PruneSourceTableEvery = 600
  PruneSourcesOlderThan = 600

[[users]]
  name = "admin"
  givenname = "Ada"
  sn = "Admin"
  mail = "admin@lab.local"
  uidnumber = 5001
  primarygroup = 5501
  otherGroups = [5503]
  passsha256 = "5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8"

[[users]]
  name = "viewer"
  givenname = "Vic"
  sn = "Viewer"
  mail = "viewer@lab.local"
  uidnumber = 5002
  primarygroup = 5503
  passsha256 = "5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8"

[[users]]
  name = "serviceuser"
  mail = "serviceuser@lab.local"
  uidnumber = 5003
  primarygroup = 5502
  passsha256 = "b018b4d81eaecb55b305ca2bc2e10d6bda436329c1c5756557787b3ecb40db17"
    [[users.capabilities]]
      action = "search"
      object = "*"

[[groups]]
