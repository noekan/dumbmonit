[package]
name = "dumbmonit-agent"
description = "Agent système DumbMonit : collecte les métriques d'une machine et les pousse vers le serveur."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Distribué par image Docker, jamais sur crates.io.
publish = false

[[bin]]
name = "dumbmonit-agent"
path = "src/main.rs"

[dependencies]
dumbmonit-proto = { path = "../proto" }
# Les collecteurs du serveur, pour le mode relais : un agent posé dans un autre
# réseau interroge les équipements de son site à la place du serveur.
dumbmonit-collectors = { path = "../collectors" }

anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

# Runtime volontairement mono-thread et réduit au strict nécessaire : l'agent
# passe sa vie à dormir, un ordonnanceur multi-thread ne lui apporterait qu'un
# surcoût mémoire sur des machines parfois très modestes.
tokio = { version = "1", default-features = false, features = [
    "rt", "macros", "time", "signal", "net", "process", "io-util", "fs", "sync",
] }

# Sans « env-filter » : la dépendance à un moteur d'expressions régulières
# doublerait presque la taille du binaire pour un réglage que trois niveaux de
# journalisation couvrent amplement.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

# Mêmes réglages TLS que le serveur, pour ne pas entretenir deux configurations.
reqwest = { version = "0.13", default-features = false, features = [
    "json", "rustls", "rustls-native-certs", "gzip",
] }

# Couche multiplateforme d'accès aux compteurs système.
sysinfo = { version = "0.39", default-features = false, features = [
    "system", "disk", "network",
] }

# Même moteur YAML que les profils de collecte du serveur : un seul format de
# configuration à connaître dans tout le produit.
serde_yaml_ng = "0.10"

# Filtres d'interfaces et de points de montage. Sans les fonctionnalités par
# défaut (« perf », Unicode complet) : les noms filtrés font quelques
# caractères, et le moteur complet pèserait lourd dans un binaire qui se veut
# petit.
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }

[dev-dependencies]
# Répertoires jetables pour les tests du secret de liaison : ils écrivent un
# fichier et en vérifient les permissions, ce qui n'a de sens que sur un vrai
# système de fichiers.
tempfile = "3"

[target.'cfg(windows)'.dependencies]
# Intégration au gestionnaire de services : point d'entrée du service, prise en
# charge de l'ordre d'arrêt, et interrogation de l'état des services surveillés.
windows-service = "0.8"
