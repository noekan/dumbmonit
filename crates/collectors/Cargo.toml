[package]
name = "dumbmonit-collectors"
description = "Collecteurs DumbMonit (SNMP, Proxmox, PBS, Synology, sondes de disponibilité) : partagés entre le serveur et l'agent relais."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Distribué par image Docker, jamais sur crates.io.
publish = false

[dependencies]
dumbmonit-proto = { path = "../proto" }

anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Sans `rt-multi-thread` : l'agent relais tourne sur un exécuteur mono-thread,
# les collecteurs n'ont besoin que des primitives réseau et de temps.
tokio = { version = "1", default-features = false, features = ["rt", "macros", "net", "time", "sync", "io-util"] }
tracing.workspace = true

# Les racines TLS sont lues dans le magasin système. L'image finale embarque le
# bundle Mozilla ; le monter en volume suffit alors à faire accepter une autorité
# privée, cas courant sur un hyperviseur ou un NAS à certificat interne.
reqwest = { version = "0.13", default-features = false, features = [
    "json", "query", "form", "rustls", "rustls-native-certs", "gzip",
] }

# SNMP v1/v2c/v3 en asynchrone. Les fonctionnalités par défaut (`tokio` +
# `crypto-rust`) couvrent v3 sans dépendance C ; `mibs` est volontairement écarté,
# il exigerait libnetsnmp et casserait le binaire statique.
#
# `heap_buffers` n'est pas un détail : sans elle, `AsyncSession` porte 128 Kio de
# tampons en ligne et sa construction consomme 1 à 2 Mio de pile, soit la totalité
# de celle d'une tâche Tokio. Un dépassement n'est pas rattrapable et abrège le
# processus entier.
snmp2 = { version = "0.5", features = ["heap_buffers"] }

serde_yaml_ng = "0.10"
ipnet = "2"
futures = "0.3"

# --- Moniteurs de disponibilité (HTTP, TCP, DNS, ICMP, expiration TLS) ---
hickory-resolver = "0.26"
# ICMP demande une socket brute, ou la plage `net.ipv4.ping_group_range` sous
# Linux : le conteneur doit donc recevoir CAP_NET_RAW pour que le ping fonctionne.
surge-ping = "0.9"
# Lecture de la date d'expiration d'un certificat présenté par un service.
x509-parser = "0.18"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

# --- Sondes applicatives (SMTP, SQL, MQTT, WebSocket) ---
#
# `base64` sert aux authentifications SMTP (AUTH PLAIN/LOGIN) et à la clé de la
# poignée de main WebSocket ; `sha1` uniquement à cette dernière, où la RFC 6455
# l'impose comme condiment de la réponse `Sec-WebSocket-Accept`. Les deux sont
# déjà dans le verrou de dépendances par transitivité : rien de neuf n'entre.
base64 = "0.22"
sha1 = "0.10"

# PostgreSQL et MySQL/MariaDB. `sqlx` est déjà la couche base du serveur ; ses
# pilotes `postgres` et `mysql` sont en Rust pur, sans C, et passent donc le
# binaire statique musl et l'image `scratch`. Le coût assumé est la taille du
# binaire de l'agent relais, qui embarque tous les collecteurs réseau : écrire
# deux protocoles d'authentification (SCRAM-SHA-256, caching_sha2_password) à la
# main coûterait bien plus cher en code à maintenir qu'en octets.
#
# `sqlite` reste hors de cette liste : ce serait la même bibliothèque C que le
# serveur, pour une base de données qu'aucune sonde réseau ne peut atteindre.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio", "postgres", "mysql", "tls-rustls-ring-native-roots",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
# Faux services HTTP (DSM, PVE) montés dans les tests unitaires.
axum = "0.8"
