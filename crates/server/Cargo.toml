[package]
name = "dumbmonit-server"
description = "Serveur DumbMonit : collecte, stockage, alerting et interface web."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Distribué par image Docker, jamais sur crates.io.
publish = false

[lib]
name = "dumbmonit_server"
path = "src/lib.rs"

[[bin]]
name = "dumbmonit"
path = "src/main.rs"

[dependencies]
dumbmonit-proto = { path = "../proto" }
dumbmonit-collectors = { path = "../collectors" }

anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `process` et `io-util` : lancement du VictoriaMetrics embarqué et recopie de son journal.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs", "process", "io-util"] }
tracing.workspace = true

axum = "0.8"
tower-http = { version = "0.7", features = ["trace", "compression-gzip"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio", "sqlite", "migrate", "chrono", "macros",
] }

# Les racines TLS sont lues dans le magasin système. L'image finale embarque le
# bundle Mozilla ; le monter en volume suffit alors à faire accepter une autorité
# privée, cas courant sur un webhook interne ou un serveur SMTP d'entreprise.
reqwest = { version = "0.13", default-features = false, features = [
    "json", "query", "form", "rustls", "rustls-native-certs", "gzip",
] }

# Les collecteurs réseau (SNMP, sondes de disponibilité, clients Proxmox/PBS/DSM)
# vivent dans `dumbmonit-collectors`, avec leurs dépendances.
ipnet = "2"
futures = "0.3"

rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"

# Mêmes choix que reqwest : rustls + ring, et racines TLS embarquées.
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport", "tokio1-rustls", "ring", "rustls-native-certs", "builder", "hostname",
] }

tokio-util = { version = "0.7", features = ["io"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

aes-gcm = "0.11"
argon2 = "0.6"
rand = "0.10"
hex = "0.4"
# Empreinte des jetons de session : rapide, contrairement à Argon2id qui est
# volontairement lent et serait payé à chaque requête authentifiée.
sha2 = "0.11"
# Second facteur TOTP (RFC 6238) : HMAC-SHA1, le seul algorithme que lisent
# toutes les applications d'authentification.
hmac = "0.13"
sha1 = "0.11"
# Comparaison en temps constant du secret de session.
subtle = "2.6"
# Validation des jetons d'identité OpenID Connect (signature RS256/ES256 via le
# JWKS du fournisseur). `rust_crypto` : pas de dépendance C, compatible musl.
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem", "rust_crypto"] }
# Encodage base64url du défi PKCE.
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
# SIGTERM vers le VictoriaMetrics embarqué : tokio ne sait envoyer que SIGKILL.
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# `oneshot` permet d'appeler le routeur sans ouvrir de socket.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
