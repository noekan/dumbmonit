[package]
name = "ezymonit-server"
description = "Serveur EzyMonit : collecte, stockage, alerting et interface web."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "ezymonit_server"
path = "src/lib.rs"

[[bin]]
name = "ezymonit"
path = "src/main.rs"

[dependencies]
ezymonit-proto = { path = "../proto" }

anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs"] }
tracing.workspace = true

axum = "0.8"
tower-http = { version = "0.7", features = ["trace", "compression-gzip"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio", "sqlite", "migrate", "chrono", "macros",
] }

# Les racines TLS sont lues dans le magasin système. L'image finale embarque le
# bundle Mozilla ; le monter en volume suffit alors à faire accepter une autorité
# privée, cas courant sur un webhook interne ou un serveur SMTP d'entreprise.
reqwest = { version = "0.13", default-features = false, features = [
    "json", "query", "form", "rustls", "rustls-native-certs", "gzip",
] }

# SNMP v1/v2c/v3 en asynchrone. Les fonctionnalités par défaut (`tokio` +
# `crypto-rust`) couvrent v3 sans dépendance C ; `mibs` est volontairement écarté,
# il exigerait libnetsnmp et casserait le binaire statique.
#
# `heap_buffers` n'est pas un détail : sans elle, `AsyncSession` porte 128 Kio de
# tampons en ligne et sa construction consomme 1 à 2 Mio de pile, soit la totalité
# de celle d'une tâche Tokio. Un dépassement n'est pas rattrapable et abrège le
# processus entier.
snmp2 = { version = "0.5", features = ["heap_buffers"] }

serde_yaml_ng = "0.10"
humantime-serde = "1"
ipnet = "2"
futures = "0.3"

rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"

# Mêmes choix que reqwest : rustls + ring, et racines TLS embarquées.
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport", "tokio1-rustls", "ring", "rustls-native-certs", "builder", "hostname",
] }

# --- Moniteurs de disponibilité (HTTP, TCP, DNS, ICMP, expiration TLS) ---
hickory-resolver = "0.26"
# ICMP demande une socket brute, ou la plage `net.ipv4.ping_group_range` sous
# Linux : le conteneur doit donc recevoir CAP_NET_RAW pour que le ping fonctionne.
surge-ping = "0.9"
# Lecture de la date d'expiration d'un certificat présenté par un service.
x509-parser = "0.18"
tokio-rustls = "0.26"
tokio-util = { version = "0.7", features = ["io"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "1"

aes-gcm = "0.11"
argon2 = "0.6"
rand = "0.10"
hex = "0.4"
# Empreinte des jetons de session : rapide, contrairement à Argon2id qui est
# volontairement lent et serait payé à chaque requête authentifiée.
sha2 = "0.11"
# Comparaison en temps constant du secret de session.
subtle = "2.6"
# Validation des jetons d'identité OpenID Connect (signature RS256/ES256 via le
# JWKS du fournisseur). `rust_crypto` : pas de dépendance C, compatible musl.
jsonwebtoken = { version = "10", default-features = false, features = ["use_pem", "rust_crypto"] }
# Encodage base64url du défi PKCE.
base64 = "0.22"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# `oneshot` permet d'appeler le routeur sans ouvrir de socket.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
