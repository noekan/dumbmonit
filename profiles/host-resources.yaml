# Ressources d'un serveur ou d'un NAS, via HOST-RESOURCES-MIB (RFC 2790).
#
# Implémentée par Net-SNMP, par l'agent SNMP de Windows, et par la plupart des NAS
# grand public — Synology et QNAP compris.
id: host-resources
name: Host resources (HOST-RESOURCES-MIB)
match:
  sysobjectid:
    - 1.3.6.1.4.1.8072      # Net-SNMP (Linux, BSD, macOS)
    - 1.3.6.1.4.1.2021      # UCD-SNMP, encore annoncé par de vieux agents
    - 1.3.6.1.4.1.311.1.1.3 # agent SNMP de Windows
    - 1.3.6.1.4.1.6574      # Synology DSM
    - 1.3.6.1.4.1.24681     # QNAP QTS
    - 1.3.6.1.4.1.42        # Sun / Oracle Solaris
  priority: 0

include: [if-mib]

metrics:
  # hrSystemUptime part du démarrage de la machine, là où sysUpTime part de celui de
  # l'agent SNMP : c'est la valeur que l'utilisateur attend derrière « uptime ».
  - name: host_uptime_seconds
    oid: 1.3.6.1.2.1.25.1.1.0
    kind: gauge
    scale: 0.01

  - name: host_processes
    oid: 1.3.6.1.2.1.25.1.6.0
    kind: gauge

  - name: host_users
    oid: 1.3.6.1.2.1.25.1.5.0
    kind: gauge

  # hrProcessorLoad : moyenne de charge du processeur sur la dernière minute, en
  # pourcentage. Une ligne par cœur, d'où la borne de cardinalité.
  - name: cpu_load_percent
    oid: 1.3.6.1.2.1.25.3.3.1.2
    kind: gauge
    walk: true
    filters:
      max_rows: 256

  # La hrStorageTable mélange volumes, mémoire vive et mémoire virtuelle dans un même
  # espace d'index ; chaque métrique se restreint donc au type qui la concerne.
  # La taille n'est jamais donnée en octets : il faut multiplier un nombre d'unités
  # d'allocation par la taille de cette unité, colonne hrStorageAllocationUnits.
  - name: storage_bytes_total
    oid: 1.3.6.1.2.1.25.2.3.1.5
    kind: gauge
    walk: true
    multiply_by: 1.3.6.1.2.1.25.2.3.1.4
    labels:
      storage: 1.3.6.1.2.1.25.2.3.1.3
    filters:
      max_rows: 64
      keep_only_when_oid_equals:
        - oid: 1.3.6.1.2.1.25.2.3.1.2       # hrStorageType
          values:
            - "1.3.6.1.2.1.25.2.1.4"        # hrStorageFixedDisk
            - "1.3.6.1.2.1.25.2.1.10"       # hrStorageNetworkDisk
      drop_when_label_matches:
        storage:
          - "^/dev$"
          - "^/dev/shm"
          - "^/run"
          - "^/sys"
          - "^/proc"
          - "^/snap"
          - "^/var/lib/docker"

  - name: storage_bytes_used
    oid: 1.3.6.1.2.1.25.2.3.1.6
    kind: gauge
    walk: true
    multiply_by: 1.3.6.1.2.1.25.2.3.1.4
    labels:
      storage: 1.3.6.1.2.1.25.2.3.1.3
    filters:
      max_rows: 64
      keep_only_when_oid_equals:
        - oid: 1.3.6.1.2.1.25.2.3.1.2
          values:
            - "1.3.6.1.2.1.25.2.1.4"
            - "1.3.6.1.2.1.25.2.1.10"
      drop_when_label_matches:
        storage:
          - "^/dev$"
          - "^/dev/shm"
          - "^/run"
          - "^/sys"
          - "^/proc"
          - "^/snap"
          - "^/var/lib/docker"

  # La mémoire vive est décrite par la même table, avec le type hrStorageRam. La lire
  # ici plutôt que via hrMemorySize donne aussi la quantité utilisée, pas seulement
  # la quantité installée.
  - name: memory_bytes_total
    oid: 1.3.6.1.2.1.25.2.3.1.5
    kind: gauge
    walk: true
    multiply_by: 1.3.6.1.2.1.25.2.3.1.4
    static_labels:
      kind: ram
    filters:
      max_rows: 8
      keep_only_when_oid_equals:
        - oid: 1.3.6.1.2.1.25.2.3.1.2
          values: ["1.3.6.1.2.1.25.2.1.2"]    # hrStorageRam

  - name: memory_bytes_used
    oid: 1.3.6.1.2.1.25.2.3.1.6
    kind: gauge
    walk: true
    multiply_by: 1.3.6.1.2.1.25.2.3.1.4
    static_labels:
      kind: ram
    filters:
      max_rows: 8
      keep_only_when_oid_equals:
        - oid: 1.3.6.1.2.1.25.2.3.1.2
          values: ["1.3.6.1.2.1.25.2.1.2"]

  # Moyennes de charge de UCD-SNMP-MIB (laLoadInt, en centièmes) : Net-SNMP les
  # publie toujours, y compris là où hrProcessorLoad reste vide — c'est le cas du
  # contrôleur de gestion (BMC) Supermicro relevé, un Net-SNMP 5.8 sur ARM dont la
  # hrProcessorTable ne porte que l'identifiant du processeur. Les agents qui
  # n'implémentent pas UCD (Windows) laissent la série vide.
  - name: load_average
    oid: 1.3.6.1.4.1.2021.10.1.5
    kind: gauge
    walk: true
    scale: 0.01
    labels:
      period: 1.3.6.1.4.1.2021.10.1.2
    filters:
      max_rows: 3
