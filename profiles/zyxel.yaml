# Commutateurs Zyxel.
#
# Tout ce que Zyxel annonce sous 1.3.6.1.4.1.890 reçoit ce profil : les MIB
# standard d'un commutateur (IF-MIB, EtherLike, LLDP, via ethernet-switch) valent
# pour toute la gamme. Les OID propriétaires, eux, ne sont partagés que par la
# famille « ES » récente, qui annonce 1.3.6.1.4.1.890.1.15 et range sa gestion
# sous esMgmt (890.1.15.3) : XS1930 (relevé ci-dessous), GS1900 (même OID de
# charge processeur relevé par LibreNMS), et la MIB ZYXEL-ES-COMMON que Zyxel
# publie pour ses commutateurs gérés actuels. Les anciens modèles (890.1.5.8.x)
# et les pare-feu (890.1.6) ont une arborescence propre ; ces lignes y restent
# simplement vides.
#
# Relevé de référence : XS1930-10, micrologiciel V4.80(ABQE.4). La branche
# privée n'y a été lue que jusqu'à esMgmt.20 (relevé tronqué à 1 500 valeurs) :
# ce qui suit est marqué « au-delà du relevé » et vient de la MIB publiée par
# Zyxel, sans avoir été vu sur ce modèle.
id: zyxel
name: Zyxel switch
match:
  sysobjectid:
    - 1.3.6.1.4.1.890
  priority: 0

include: [ethernet-switch]

metrics:
  # ZYXEL-ES-COMMON, groupe sysMgmt (esMgmt.2). Pourcentages entiers.
  #
  # sysMgmtCPU1MinUsage : moyenne sur une minute, comme hrProcessorLoad. Publiée
  # sous le nom générique pour que la règle « High CPU » s'applique d'elle-même.
  # Relevé : 38 %.
  - name: cpu_load_percent
    oid: 1.3.6.1.4.1.890.1.15.3.2.8.0
    kind: gauge

  # sysMgmtCPU5MinUsage — relevé : 30 %.
  - name: zyxel_cpu_5min_percent
    oid: 1.3.6.1.4.1.890.1.15.3.2.9.0
    kind: gauge

  # sysMgmtMemUsage — relevé : 8 %.
  - name: memory_usage_percent
    oid: 1.3.6.1.4.1.890.1.15.3.2.5.0
    kind: gauge

  # Version du micrologiciel et modèle (esMgmt.1). La valeur est le numéro de
  # version majeur ; la série existe pour ses étiquettes. Relevé : « V4.80(ABQE.4)
  # | 08/23/2024 », « XS1930-10 ».
  - name: zyxel_firmware_info
    oid: 1.3.6.1.4.1.890.1.15.3.1.2.0
    kind: gauge
    labels:
      firmware: 1.3.6.1.4.1.890.1.15.3.1.6.0
      model: 1.3.6.1.4.1.890.1.15.3.1.11.0

  # ZYXEL-HW-MONITOR-MIB (esMgmt.26) — au-delà du relevé. Températures en °C et
  # seuil haut propre à chaque capteur ; ventilateurs en tr/min et seuil bas. Les
  # colonnes d'état de cette MIB sont des chaînes libres, non lues ici : l'alerte
  # compare la mesure au seuil que l'équipement publie lui-même.
  - name: zyxel_temperature_celsius
    oid: 1.3.6.1.4.1.890.1.15.3.26.1.2.1.3
    kind: gauge
    walk: true
    labels:
      sensor: 1.3.6.1.4.1.890.1.15.3.26.1.2.1.2

  - name: zyxel_temperature_high_threshold_celsius
    oid: 1.3.6.1.4.1.890.1.15.3.26.1.2.1.6
    kind: gauge
    walk: true
    labels:
      sensor: 1.3.6.1.4.1.890.1.15.3.26.1.2.1.2

  - name: zyxel_fan_rpm
    oid: 1.3.6.1.4.1.890.1.15.3.26.1.1.1.3
    kind: gauge
    walk: true
    labels:
      fan: 1.3.6.1.4.1.890.1.15.3.26.1.1.1.2

  - name: zyxel_fan_low_threshold_rpm
    oid: 1.3.6.1.4.1.890.1.15.3.26.1.1.1.6
    kind: gauge
    walk: true
    labels:
      fan: 1.3.6.1.4.1.890.1.15.3.26.1.1.1.2

filters:
  max_rows: 32
