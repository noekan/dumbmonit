# Interfaces réseau, telles que décrites par IF-MIB (RFC 2863).
#
# Applicable à presque tout équipement SNMP, d'où son rôle de profil de repli : à
# défaut de mieux, les compteurs d'interfaces sont toujours utiles.
id: if-mib
name: Network interfaces (IF-MIB)
match:
  sysobjectid: ["*"]
  # Passe devant « system », qui répond aussi à « * ».
  priority: 10

include: [system]

metrics:
  # Compteurs 64 bits de la ifXTable : indispensables au-delà du gigabit, où un
  # compteur 32 bits boucle en une trentaine de secondes. Un équipement qui ne les
  # implémente pas laisse simplement ces séries vides.
  - name: if_octets_in
    oid: 1.3.6.1.2.1.31.1.1.1.6
    kind: counter
    walk: true
    labels:
      ifname: 1.3.6.1.2.1.31.1.1.1.1
      ifalias: 1.3.6.1.2.1.31.1.1.1.18

  - name: if_octets_out
    oid: 1.3.6.1.2.1.31.1.1.1.10
    kind: counter
    walk: true
    labels:
      ifname: 1.3.6.1.2.1.31.1.1.1.1
      ifalias: 1.3.6.1.2.1.31.1.1.1.18

  - name: if_packets_in
    oid: 1.3.6.1.2.1.31.1.1.1.7
    kind: counter
    walk: true
    labels:
      ifname: 1.3.6.1.2.1.31.1.1.1.1

  - name: if_packets_out
    oid: 1.3.6.1.2.1.31.1.1.1.11
    kind: counter
    walk: true
    labels:
      ifname: 1.3.6.1.2.1.31.1.1.1.1

  # Erreurs et rejets : seule la ifTable les porte, il n'existe pas de version
  # 64 bits. Un compteur qui décolle est le premier signe d'un câble fatigué.
  - name: if_errors_in
    oid: 1.3.6.1.2.1.2.2.1.14
    kind: counter
    walk: true
    labels:
      ifname: 1.3.6.1.2.1.31.1.1.1.1

  - name: if_errors_out
    oid: 1.3.6.1.2.1.2.2.1.20
    kind: counter
    walk: true
    labels:
      ifname: 1.3.6.1.2.1.31.1.1.1.1

  - name: if_discards_in
    oid: 1.3.6.1.2.1.2.2.1.13
    kind: counter
    walk: true
    labels:
      ifname: 1.3.6.1.2.1.31.1.1.1.1

  - name: if_discards_out
    oid: 1.3.6.1.2.1.2.2.1.19
    kind: counter
    walk: true
    labels:
      ifname: 1.3.6.1.2.1.31.1.1.1.1

  # États : 1 = up, 2 = down, 3 = testing, puis 4 à 7 pour les états intermédiaires
  # de la ifOperStatus (unknown, dormant, notPresent, lowerLayerDown).
  - name: if_admin_status
    oid: 1.3.6.1.2.1.2.2.1.7
    kind: gauge
    walk: true
    labels:
      ifname: 1.3.6.1.2.1.31.1.1.1.1

  - name: if_oper_status
    oid: 1.3.6.1.2.1.2.2.1.8
    kind: gauge
    walk: true
    labels:
      ifname: 1.3.6.1.2.1.31.1.1.1.1
      ifalias: 1.3.6.1.2.1.31.1.1.1.18

  # ifHighSpeed est en Mbit/s, contrairement à ifSpeed (bit/s) qui sature à 4 Gbit/s.
  - name: if_speed_bps
    oid: 1.3.6.1.2.1.31.1.1.1.15
    kind: gauge
    walk: true
    scale: 1000000.0
    labels:
      ifname: 1.3.6.1.2.1.31.1.1.1.1

# Un châssis de 48 ports produirait plus de cinq cents séries sans ces filtres, dont
# l'immense majorité pour des ports jamais branchés.
filters:
  max_rows: 256

  drop_when_label_matches:
    ifname:
      - "^lo$"          # boucle locale Linux
      - "^lo0$"         # boucle locale BSD, IOS, JunOS
      - "^Loopback"     # boucle locale IOS nommée
      - "^Null"         # interface de rejet IOS
      - "^veth"         # extrémités de conteneurs
      - "^docker"
      - "^br-"          # ponts Docker
      - "^virbr"        # ponts libvirt
      - "^vnet"         # cartes de machines virtuelles
      - "^tap"
      - "^tun"
      - "^dummy"
      - "^sit"
      - "^ip6tnl"
      - "^bond[0-9]+\\.[0-9]+$"   # sous-interfaces de VLAN sur agrégat

  drop_when_oid_equals:
    # ifAdminStatus : ce que l'administrateur a volontairement désactivé n'a pas à
    # remonter. 2 = down, 3 = testing.
    - oid: 1.3.6.1.2.1.2.2.1.7
      values: [2, 3]
    # ifType : les interfaces sans réalité physique ni intérêt de supervision.
    # 24 = softwareLoopback, 53 = propVirtual, 131 = tunnel, 150 = mplsTunnel.
    - oid: 1.3.6.1.2.1.2.2.1.3
      values: [24, 53, 131, 150]

  drop_when_all:
    # Le cas du port jamais utilisé : état bas *et* ifLastChange resté à zéro, donc
    # jamais monté depuis le démarrage. Une interface tombée en panne, elle, a un
    # ifLastChange non nul et reste supervisée — c'est justement celle qui compte.
    - conditions:
        - oid: 1.3.6.1.2.1.2.2.1.8
          values: [2, 6]
        - oid: 1.3.6.1.2.1.2.2.1.9
          values: [0]
